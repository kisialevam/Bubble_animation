<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10051f">
  <title>Bubble — Phaser</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    #game {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #10051f;
    }

    #game canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <main id="game" aria-label="Бабл с изображением x1"></main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
  <script>
    (() => {
      'use strict';

      class BubbleScene extends Phaser.Scene {
        preload() {
          this.load.image('bubble', 'buble.png');
          this.load.image('x1', 'x1.png');
        }

        create() {
          this.bubble = this.add.image(0, 0, 'bubble');
          this.x1 = this.add.image(0, 0, 'x1');

          this.positionImages(this.scale.gameSize);
          this.scale.on('resize', this.positionImages, this);
        }

        positionImages(gameSize) {
          const centerX = gameSize.width / 2;
          const centerY = gameSize.height / 2;

          // Обе картинки отображаются в исходном масштабе 1:1.
          this.bubble.setPosition(centerX, centerY).setScale(1);
          this.x1.setPosition(centerX, centerY - 27).setScale(1);
        }
      }

      new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game',
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundColor: '#10051f',
        pixelArt: true,
        antialias: false,
        roundPixels: true,
        scale: {
          mode: Phaser.Scale.RESIZE
        },
        scene: BubbleScene
      });
    })();
  </script>
</body>
</html>
