<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10051f">
  <title>Bubble — Phaser</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    #game {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #10051f;
    }

    body {
      font-family: "Courier New", monospace;
    }

    #game canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .controls {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: min(94vw, 820px);
      transform: translateX(-50%);
    }

    .coordinates,
    button {
      min-height: 42px;
      border: 2px solid #7d53a8;
      border-radius: 8px;
      background: #211034;
      color: #fff;
      font: 700 14px/1 "Courier New", monospace;
      box-shadow: 0 4px 0 #09030f;
    }

    .coordinates {
      display: grid;
      place-items: center;
      min-width: 140px;
      padding: 0 14px;
      color: #e7d8f7;
    }

    button {
      padding: 0 16px;
      cursor: pointer;
    }

    button:hover {
      border-color: #ca9cff;
      background: #32164f;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #09030f;
    }

    button:focus-visible {
      outline: 3px solid #ff60ae;
      outline-offset: 3px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .animation-settings {
      display: grid;
      flex-basis: 100%;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 11px 12px;
      border: 2px solid #4d3267;
      border-radius: 8px;
      background: rgba(20, 8, 32, 0.92);
      box-shadow: 0 4px 0 #09030f;
    }

    .setting {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      color: #e7d8f7;
      font-size: 12px;
      font-weight: 700;
    }

    .setting input {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: #ff60ae;
      cursor: pointer;
    }

    .setting output {
      color: #ff8dc3;
    }

    .help {
      flex-basis: 100%;
      margin: 3px 0 0;
      color: #a98cbe;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 680px) {
      .animation-settings {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main id="game" aria-label="Бабл с переключаемым изображением"></main>

  <div class="controls" role="toolbar" aria-label="Управление изображением в бабле">
    <output id="coordinates" class="coordinates" aria-live="polite">WOW · x: 8, y: -20</output>
    <button id="copy-coordinates" type="button">Скопировать координаты WOW</button>
    <button id="swap-image" type="button">Прыжок → WOW</button>

    <div class="animation-settings" aria-label="Настройки анимации">
      <label class="setting" for="anticipation">
        <span>Заскок вниз</span>
        <output id="anticipation-value" for="anticipation">24 px</output>
        <input id="anticipation" type="range" min="0" max="60" value="24" step="1">
      </label>

      <label class="setting" for="jump-height">
        <span>Высота прыжка</span>
        <output id="jump-height-value" for="jump-height">76 px</output>
        <input id="jump-height" type="range" min="20" max="180" value="76" step="1">
      </label>

      <label class="setting" for="landing-bounce">
        <span>Баунс в конце</span>
        <output id="landing-bounce-value" for="landing-bounce">14 px</output>
        <input id="landing-bounce" type="range" min="0" max="50" value="14" step="1">
      </label>
    </div>

    <p class="help">Стрелки двигают WOW, когда он виден · Shift + стрелки — по 10 px</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
  <script>
    (() => {
      'use strict';

      class BubbleScene extends Phaser.Scene {
        constructor() {
          super('BubbleScene');
          this.positions = {
            x1: { x: 8, y: -20 },
            wow: { x: 8, y: -20 }
          };
          this.activeTexture = 'x1';
          this.isAnimating = false;
        }

        preload() {
          this.load.image('bubble', 'buble.png');
          this.load.image('x1', 'x1.png');
          this.load.image('wow', 'wow.png');
        }

        create() {
          this.bubble = this.add.image(0, 0, 'bubble');
          this.content = this.add.image(0, 0, this.activeTexture);

          this.coordinatesOutput = document.querySelector('#coordinates');
          this.copyButton = document.querySelector('#copy-coordinates');
          this.swapButton = document.querySelector('#swap-image');
          this.anticipationSlider = document.querySelector('#anticipation');
          this.jumpHeightSlider = document.querySelector('#jump-height');
          this.landingBounceSlider = document.querySelector('#landing-bounce');
          this.sliders = [
            this.anticipationSlider,
            this.jumpHeightSlider,
            this.landingBounceSlider
          ];

          this.handleKeyDown = (event) => this.moveWithKeyboard(event);
          this.handleCopyClick = () => this.copyCoordinates();
          this.handleSwapClick = () => this.jumpAndSwap();
          this.handleSliderInput = (event) => this.updateSliderValue(event.target);

          window.addEventListener('keydown', this.handleKeyDown);
          this.copyButton.addEventListener('click', this.handleCopyClick);
          this.swapButton.addEventListener('click', this.handleSwapClick);
          this.sliders.forEach((slider) => {
            slider.addEventListener('input', this.handleSliderInput);
            this.updateSliderValue(slider);
          });

          this.positionImages(this.scale.gameSize);
          this.updateCoordinates();
          this.scale.on('resize', this.positionImages, this);

          this.events.once('shutdown', () => {
            window.removeEventListener('keydown', this.handleKeyDown);
            this.copyButton.removeEventListener('click', this.handleCopyClick);
            this.swapButton.removeEventListener('click', this.handleSwapClick);
            this.sliders.forEach((slider) => {
              slider.removeEventListener('input', this.handleSliderInput);
            });
          });
        }

        positionImages(gameSize) {
          this.centerX = gameSize.width / 2;
          this.centerY = gameSize.height / 2;

          // Все изображения сохраняют исходный масштаб 1:1.
          this.bubble.setPosition(this.centerX, this.centerY).setScale(1);

          if (!this.isAnimating) {
            this.positionContent();
          }
        }

        positionContent() {
          const position = this.positions[this.activeTexture];
          this.content
            .setPosition(this.centerX + position.x, this.centerY + position.y)
            .setScale(1);
        }

        moveWithKeyboard(event) {
          const directions = {
            ArrowLeft: [-1, 0],
            ArrowRight: [1, 0],
            ArrowUp: [0, -1],
            ArrowDown: [0, 1]
          };
          const direction = directions[event.key];

          if (!direction) {
            return;
          }

          event.preventDefault();

          if (this.isAnimating || this.activeTexture !== 'wow') {
            return;
          }

          const step = event.shiftKey ? 10 : 1;
          this.positions.wow.x += direction[0] * step;
          this.positions.wow.y += direction[1] * step;
          this.positionContent();
          this.updateCoordinates();
        }

        updateCoordinates() {
          const { x, y } = this.positions.wow;
          this.coordinatesOutput.textContent = `WOW · x: ${x}, y: ${y}`;
        }

        updateSliderValue(slider) {
          const output = document.querySelector(`#${slider.id}-value`);
          output.textContent = `${slider.value} px`;
        }

        getAnimationSettings() {
          return {
            anticipation: Number(this.anticipationSlider.value),
            jumpHeight: Number(this.jumpHeightSlider.value),
            landingBounce: Number(this.landingBounceSlider.value)
          };
        }

        async copyCoordinates() {
          const { x, y } = this.positions.wow;
          const text = `WOW относительно центра бабла: x=${x}, y=${y}`;

          try {
            if (!navigator.clipboard?.writeText) {
              throw new Error('Clipboard API is unavailable');
            }
            await navigator.clipboard.writeText(text);
          } catch (error) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            textArea.remove();
          }

          window.clearTimeout(this.copyResetTimer);
          this.copyButton.textContent = 'Скопировано ✓';
          this.copyResetTimer = window.setTimeout(() => {
            this.copyButton.textContent = 'Скопировать координаты WOW';
          }, 1300);
        }

        jumpAndSwap() {
          if (this.isAnimating) {
            return;
          }

          this.isAnimating = true;
          this.swapButton.disabled = true;

          const currentPosition = this.positions[this.activeTexture];
          const nextTexture = this.activeTexture === 'x1' ? 'wow' : 'x1';
          const nextPosition = this.positions[nextTexture];
          const currentBaseY = this.centerY + currentPosition.y;
          const nextBaseX = this.centerX + nextPosition.x;
          const nextBaseY = this.centerY + nextPosition.y;
          const { anticipation, jumpHeight, landingBounce } = this.getAnimationSettings();
          const hasAnticipation = anticipation > 0;

          const finishAnimation = () => {
            this.content.setPosition(nextBaseX, nextBaseY).setScale(1);
            this.isAnimating = false;
            this.swapButton.disabled = false;
          };

          const playLandingBounce = () => {
            if (landingBounce === 0) {
              finishAnimation();
              return;
            }

            this.tweens.add({
              targets: this.content,
              y: nextBaseY - landingBounce * 0.55,
              scaleX: 0.98,
              scaleY: 1.03,
              duration: 135,
              ease: 'Quad.Out',
              onComplete: () => {
                this.tweens.add({
                  targets: this.content,
                  y: nextBaseY,
                  scaleX: 1,
                  scaleY: 1,
                  duration: 165,
                  ease: 'Sine.InOut',
                  onComplete: finishAnimation
                });
              }
            });
          };

          // Явный заскок вниз перед прыжком. Его глубину задаёт первый ползунок.
          this.tweens.add({
            targets: this.content,
            y: currentBaseY + anticipation,
            scaleX: hasAnticipation ? 1.08 : 1,
            scaleY: hasAnticipation ? 0.9 : 1,
            duration: 135,
            ease: 'Quad.In',
            onComplete: () => {
              this.tweens.add({
                targets: this.content,
                y: currentBaseY - jumpHeight,
                scaleX: 0.98,
                scaleY: 1.07,
                duration: 300,
                ease: 'Quad.Out',
                onComplete: () => {
                  // Замена происходит ровно в верхней точке прыжка.
                  this.content.setTexture(nextTexture);
                  this.content.setPosition(nextBaseX, nextBaseY - jumpHeight);
                  this.activeTexture = nextTexture;
                  this.swapButton.textContent = nextTexture === 'wow'
                    ? 'Прыжок → x1'
                    : 'Прыжок → WOW';

                  this.tweens.add({
                    targets: this.content,
                    y: nextBaseY + landingBounce,
                    scaleX: landingBounce > 0 ? 1.07 : 1,
                    scaleY: landingBounce > 0 ? 0.91 : 1,
                    duration: 300,
                    ease: 'Quad.In',
                    onComplete: playLandingBounce
                  });
                }
              });
            }
          });
        }
      }

      new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game',
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundColor: '#10051f',
        pixelArt: true,
        antialias: false,
        roundPixels: true,
        scale: {
          mode: Phaser.Scale.RESIZE
        },
        scene: BubbleScene
      });
    })();
  </script>
</body>
</html>
